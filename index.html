<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Art Spark — your personal art studio. Trace, colour, get kind feedback from an AI art judge, and explore every way to make art." />
    <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)" />
    <title>Art Spark — Draw. Colour. Get inspired.</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('artspark:settings') || '{}').state || {}
        var t = s.theme || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (s.language) document.documentElement.lang = s.language
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static splash: paints instantly while the app boots, replaced by React. -->
      <div id="splash" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:var(--sp-bg);color:var(--sp-ink);font-family:Georgia,'Times New Roman',serif">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#1B1A17"/><path d="M14 44c6-14 14-26 30-30-2 9-9 21-22 28" fill="none" stroke="#F2A93B" stroke-width="6" stroke-linecap="round"/><circle cx="46" cy="44" r="7" fill="#E4572E"/><circle cx="20" cy="20" r="3.5" fill="#2F80C4"/></svg>
        <p id="splash-title" style="margin:0;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;letter-spacing:-0.03em">Draw. Colour. <em style="font-weight:300">Get inspired.</em></p>
        <p id="splash-sub" style="margin:0;font:400 1rem/1.5 system-ui,sans-serif;opacity:.7">Opening the Art Spark studio…</p>
      </div>
      <style>
        :root { --sp-bg: #f6f1e7; --sp-ink: #1b1a17; }
        [data-theme='dark'] { --sp-bg: #12100e; --sp-ink: #f3ebdd; }
        body { margin: 0; background: var(--sp-bg); }
      </style>
      <script>
        try {
          var st = JSON.parse(localStorage.getItem('artspark:settings') || '{}').state || {}
          if (st.language === 'vi') {
            document.getElementById('splash-title').innerHTML = 'Vẽ. Tô màu. <em style="font-weight:300">Truyền cảm hứng.</em>'
            document.getElementById('splash-sub').textContent = 'Đang mở xưởng vẽ Art Spark…'
          }
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
